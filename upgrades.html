<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خيارات ترقية المنصة</title>
    <!-- Tailwind v4 via CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Noto Kufi Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-32">
    <!-- Header -->
    <header class="max-w-4xl mx-auto px-4 py-16 text-center">
        <h1 class="text-4xl md:text-5xl font-black mb-4 text-emerald-800">خيارات ترقية المنصة</h1>
        <p class="text-lg text-slate-600">اختر الميزات الإضافية التي ترغب في دمجها للنسخة التجريبية (PoC)، ثم انسخ الملخص في الأسفل وأرسله في المحادثة.</p>
    </header>

    <!-- Upgrades Grid -->
    <div class="max-w-5xl mx-auto px-4 grid md:grid-cols-2 gap-6" id="upgrades-container">
        <!-- Injected via JS -->
    </div>

    <!-- Floating Action Bar -->
    <div class="fixed bottom-6 left-6 right-6 md:left-auto md:right-1/2 md:translate-x-1/2 md:w-[500px] bg-slate-900 rounded-2xl p-4 shadow-2xl flex items-center justify-between z-50">
        <div class="text-white px-2">
            <div class="font-bold text-sm" id="selection-count">لم يتم تحديد أي ترقية</div>
        </div>
        <button onclick="copySummary()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-6 py-3 rounded-xl font-bold text-sm transition-all flex items-center gap-2">
            <i data-lucide="copy" class="w-4 h-4"></i>
            <span id="copy-text">نسخ الملخص</span>
        </button>
    </div>

    <script>
        const upgrades = [
            { id: 'framer', category: 'البصريات والحركات', title: 'دمج Framer Motion', desc: 'إضافة حركات سلسة وفيزيائية للعناصر عند التمرير والظهور.' },
            { id: '3d', category: 'البصريات والحركات', title: 'تأثير 3D تفاعلي', desc: 'جعل واجهات الهاتف ولوحة التحكم تميل وتتفاعل بذكاء مع حركة الماوس.' },
            { id: 'interactive', category: 'البصريات والحركات', title: 'تفاعل بصري حي', desc: 'تأثيرات Hover نبضية لأزرار الهاتف وتلميحات الإحصائيات.' },
            { id: 'whatsapp', category: 'تجربة المستخدم', title: 'أيقونة واتساب عائمة', desc: 'زر واتساب نابض يظل ثابتاً في زاوية الشاشة لسهولة التواصل.' },
            { id: 'marquee', category: 'تجربة المستخدم', title: 'شريط شركاء متحرك', desc: 'شريط لا نهائي بشعارات شركاء النجاح لزيادة الموثوقية.' },
            { id: 'theme', category: 'تجربة المستخدم', title: 'مبدل ألوان النظام', desc: 'اختيار لون الهوية (أخضر، أزرق، برتقالي) لإظهار ميزة White-labeling.' },
            { id: 'split', category: 'الهندسة البرمجية', title: 'فصل المكونات', desc: 'تقسيم ملف التطبيق الضخم لتسهيل التطوير المستقبلي وإدارته.' },
            { id: 'locales', category: 'الهندسة البرمجية', title: 'فصل المحتوى النصي', desc: 'تجهيز المنصة لدعم لغات متعددة (إنجليزية) عبر فصل النصوص.' },
            { id: 'fonts', category: 'الجماليات', title: 'خطوط احترافية', desc: 'تغيير الخط الأساسي لخط مؤسسي عصري مثل Tajawal.' }
        ];

        let selected = [];

        function renderUpgrades() {
            const container = document.getElementById('upgrades-container');
            container.innerHTML = upgrades.map(u => {
                const isSelected = selected.includes(u.id);
                return `
                    <div onclick="toggle('${u.id}')" class="cursor-pointer border-2 p-5 rounded-2xl flex items-start gap-4 transition-all ${isSelected ? 'border-emerald-500 bg-emerald-50' : 'border-slate-200 bg-white hover:border-slate-300'}">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5 ${isSelected ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-300'}">
                            ${isSelected ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                        </div>
                        <div>
                            <div class="text-xs font-bold text-emerald-600 mb-1">${u.category}</div>
                            <h3 class="font-bold text-slate-900 text-lg mb-1">${u.title}</h3>
                            <p class="text-sm text-slate-500">${u.desc}</p>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
            
            document.getElementById('selection-count').innerText = selected.length > 0 ? \`تم تحديد \${selected.length} ترقيات\` : 'لم يتم تحديد أي ترقية';
        }

        function toggle(id) {
            if (selected.includes(id)) {
                selected = selected.filter(x => x !== id);
            } else {
                selected.push(id);
            }
            renderUpgrades();
        }

        function copySummary() {
            if (selected.length === 0) return;
            const names = selected.map(id => upgrades.find(u => u.id === id).title);
            const text = \`مرحباً، أود تنفيذ الترقيات التالية:\n- \${names.join('\\n- ')}\`;
            navigator.clipboard.writeText(text);
            document.getElementById('copy-text').innerText = 'تم النسخ!';
            setTimeout(() => {
                document.getElementById('copy-text').innerText = 'نسخ الملخص';
            }, 2000);
        }

        renderUpgrades();
    </script>
</body>
</html>
